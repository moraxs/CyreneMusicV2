org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 工具链固定在 AGP 8.7.3 + Kotlin 2.1.0 + Gradle 8.9（Flutter 3.44.4 完整支持的
# 经典配置）。此前用的 AGP 9 + newDsl/builtInKotlin 与当前 Flutter 自带的 Gradle
# 插件不兼容：newDsl=true 会让插件应用时抛 NullPointerException；而 AGP 9 又强制
# 整个插件生态迁移到 built-in Kotlin，file_picker 11.x /
# flutter_plugin_android_lifecycle 等尚未迁移，导致编译失败。
# 回到 AGP 8.x 后各插件走经典 `apply org.jetbrains.kotlin.android` 路径，
# app 模块也在 plugins 块显式 apply KGP，无需 newDsl/builtInKotlin 标志。

# Kotlin 2.x 插件模块在 Windows 上可能同时持有增量缓存文件，
# 导致编译结束时关闭 `*.tab` 缓存失败。MVP 阶段优先保证构建稳定性。
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=false
org.gradle.parallel=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
