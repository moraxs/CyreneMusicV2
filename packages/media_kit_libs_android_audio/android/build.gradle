import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_audio'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_audio'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}


task downloadDependencies(type: Exec)  {
    
        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        // 定制 libmpv 构建（含 DSP 滤镜：bass/treble/stereowiden/crossfeed/
        // dynaudnorm/acompressor/alimiter/aecho/acrusher/vibrato）。官方 release
        // 的最小音频构建只编进了 equalizer，这些滤镜会被 libmpv 拒绝。
        // 上游基线 v1.1.8（对应 pub 上的 media_kit_libs_android_audio 1.3.8）。
        def release = "v1.1.9-dsp"
        def repository = "https://github.com/moraxs/libmpv-android-audio-build"

        // Download all *.jar dependencies & verify their MD5 checksums.
        def filesToDownload = [
            ["url": "$repository/releases/download/$release/default-arm64-v8a.jar", "md5": "58cda5c9c58c9ce592f4d02df134dffc", "destination": file("$buildDir/$release/default-arm64-v8a.jar")],
            ["url": "$repository/releases/download/$release/default-armeabi-v7a.jar", "md5": "99541acefb8d2dff41a51453d3e56120", "destination": file("$buildDir/$release/default-armeabi-v7a.jar")],
            ["url": "$repository/releases/download/$release/default-x86_64.jar", "md5": "17a79c9959d457a1fc87c39da7384adf", "destination": file("$buildDir/$release/default-x86_64.jar")],
            ["url": "$repository/releases/download/$release/default-x86.jar", "md5": "149535222d3cd4b61d692e4709a16af2", "destination": file("$buildDir/$release/default-x86.jar")]
        ]

        filesToDownload.each { fileInfo ->
            def destFile = fileInfo.destination

            if (destFile.exists()) {
                def calculatedMD5 = MessageDigest.getInstance("MD5").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()

                if (calculatedMD5 != fileInfo.md5) {
                    destFile.delete()
                    println "MD5 mismatch. File deleted: ${destFile}"
                }

            }

            if (!destFile.exists()) {
                destFile.parentFile.mkdirs()
                println "Downloading file from: ${fileInfo.url}"
                destFile.withOutputStream { os ->
                    os << new URL(fileInfo.url).openStream()
                }
                def calculatedMD5 = MessageDigest.getInstance("MD5").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()
                if (calculatedMD5 != fileInfo.md5) {
                    throw new GradleException("MD5 verification failed for ${destFile}")
                }
               
            }

            copy {
                from destFile
                into outputDir
            }
        }
    
}

assemble.dependsOn(downloadDependencies)
