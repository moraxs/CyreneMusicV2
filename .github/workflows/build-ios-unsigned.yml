name: Build iOS Unsigned IPA

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    tags: [ 'v*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iOS .ipa
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build iOS release (no codesign)
        run: flutter build ios --release --no-codesign

      # 自定义 libmpv 走 packages/media_kit_libs_ios_audio 的 Makefile 下载，
      # 一旦没进包，应用会在 MediaKit.ensureInitialized() 抛异常、runApp 不执行，
      # 装上就是白屏而不是崩溃——没有这道断言就会一路发到用户手上。
      - name: Assert libmpv is embedded
        run: |
          set -euo pipefail
          test -f build/ios/iphoneos/Runner.app/Frameworks/Mpv.framework/Mpv \
            || { echo "::error::Mpv.framework 缺失，产物会白屏"; ls -la build/ios/iphoneos/Runner.app/Frameworks || true; exit 1; }

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -y cyrene_music_reborn-unsigned.ipa Payload/
          ls -lh cyrene_music_reborn-unsigned.ipa

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cyrene-music-reborn-ios-unsigned
          path: |
            cyrene_music_reborn-unsigned.ipa
            Payload/Runner.app
          if-no-files-found: error
